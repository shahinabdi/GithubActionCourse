name: Deploy

run-name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to deploy"
        type: choice
        options:
          - dev
          - uat
          - production
        required: true
        default: uat
      version:
        description: "Image version to deploy (e.g. 0.0.2) or 'latest'"
        required: true
        default: latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Configure required reviewers on this environment for a manual approval gate.
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate deployment secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=()
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::Missing deployment secret(s): %s. Configure them in the %s environment.\n' "${missing[*]}" "${{ inputs.environment }}"
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml
          target: ~/todo-app
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,APP_VERSION
          script: |
            cd ~/todo-app
            docker compose pull
            docker compose up -d
            docker image prune -f
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          APP_VERSION: ${{ inputs.version }}
      - if: inputs.environment == 'uat' || inputs.environment == 'production'
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - if: inputs.environment == 'uat' || inputs.environment == 'production'
        run: uv sync --frozen
      - name: Run UAT E2E tests
        if: inputs.environment == 'uat'
        env:
          E2E_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          test -n "$E2E_BASE_URL" || (echo "::error::Configure DEPLOY_BASE_URL in the uat environment." && exit 1)
          uv run pytest tests/e2e
      - name: Run production sanity tests
        if: inputs.environment == 'production'
        env:
          PRODUCTION_BASE_URL: ${{ vars.DEPLOY_BASE_URL }}
        run: |
          test -n "$PRODUCTION_BASE_URL" || (echo "::error::Configure DEPLOY_BASE_URL in the production environment." && exit 1)
          uv run pytest tests/sanity
