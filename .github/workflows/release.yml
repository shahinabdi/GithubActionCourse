name: Release

# A merged PR on main is a push to main, so this covers both cases.
on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.tag.outputs.new_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Bumps patch by default; put #minor or #major in a commit message to bump higher.
      - id: tag
        uses: mathieudutour/github-tag-action@v6.2
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: main
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true

  docker:
    needs: release
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - id: creds
        name: Check Docker Hub credentials
        run: |
          if [ -n "${{ vars.DOCKERHUB_USERNAME }}" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::DOCKERHUB_USERNAME variable or DOCKERHUB_TOKEN secret is not set; skipping image push."
          fi
      - if: steps.creds.outputs.configured == 'true'
        uses: actions/checkout@v4
      - if: steps.creds.outputs.configured == 'true'
        uses: docker/setup-buildx-action@v3
      - if: steps.creds.outputs.configured == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - if: steps.creds.outputs.configured == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: APP_VERSION=${{ needs.release.outputs.version }}
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/todo-app:${{ needs.release.outputs.version }}
            ${{ vars.DOCKERHUB_USERNAME }}/todo-app:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
