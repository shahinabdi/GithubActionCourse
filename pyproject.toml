[project]
name = "todo-app"
version = "0.1.0"
description = "Minimal Flask + SQLite todo app used to demo CI/CD"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "flask>=3.0",
    "gunicorn>=22.0",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: fast in-process tests for development",
    "e2e: end-to-end tests for the pre-production environment",
    "sanity: read-only checks for production",
]
